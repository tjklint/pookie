<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="Antonina, 21. New model based in Montreal." />
    <title>Antonina | Model Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;450;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <header class="rail">
      <div class="identity">
        <a class="name" href="#portfolio"><h1>Antonina</h1></a>
        <p>Montreal, Canada<br />21 · New model</p>
      </div>
      <nav aria-label="Main navigation">
        <a class="current" href="#portfolio"><span class="nav-dot" aria-hidden="true"></span>Portfolio <span class="count">06</span></a>
        <a href="#contact">Contact <span aria-hidden="true">↗</span></a>
      </nav>
      <div class="rail-note"><span>Model book</span><span>2026</span></div>
    </header>

    <main id="portfolio">
      <div class="book-heading"><p>Selected images</p><span>01 — 06</span></div>
      <section class="book" aria-label="Portfolio photographs">
        <figure>
          <button class="photo" data-photo data-title="01 / 06" aria-label="Open photograph 1 of 6"><img src="https://images.dog.ceo/breeds/hound-basset/n02088238_13799.jpg" alt="Placeholder: a basset hound with long ears" fetchpriority="high" /></button>
          <figcaption>01</figcaption>
        </figure>
        <figure>
          <button class="photo monochrome" data-photo data-title="02 / 06" aria-label="Open photograph 2 of 6"><img src="https://images.dog.ceo/breeds/hound-basset/n02088238_11281.jpg" alt="Placeholder: a basset hound in natural light" /></button>
          <figcaption>02</figcaption>
        </figure>
        <figure>
          <button class="photo" data-photo data-title="03 / 06" aria-label="Open photograph 3 of 6"><img src="https://images.dog.ceo/breeds/hound-basset/n02088238_10072.jpg" alt="Placeholder: a basset hound looking toward the camera" loading="lazy" /></button>
          <figcaption>03</figcaption>
        </figure>
        <figure>
          <button class="photo" data-photo data-title="04 / 06" aria-label="Open photograph 4 of 6"><img src="https://images.dog.ceo/breeds/hound-basset/n02088238_13439.jpg" alt="Placeholder: a basset hound outdoors" loading="lazy" /></button>
          <figcaption>04</figcaption>
        </figure>
        <figure>
          <button class="photo monochrome" data-photo data-title="05 / 06" aria-label="Open photograph 5 of 6"><img src="https://images.dog.ceo/breeds/hound-basset/n02088238_9960.jpg" alt="Placeholder: a tricolour basset hound" loading="lazy" /></button>
          <figcaption>05</figcaption>
        </figure>
        <figure>
          <button class="photo" data-photo data-title="06 / 06" aria-label="Open photograph 6 of 6"><img src="https://images.dog.ceo/breeds/hound-basset/n02088238_10142.jpg" alt="Placeholder: a basset hound portrait" loading="lazy" /></button>
          <figcaption>06</figcaption>
        </figure>
      </section>
      <div class="placeholder-note">Basset hounds standing in. Antonina's photos coming soon.</div>
      <footer id="contact">
        <div><h2>Contact</h2><p>Booking details coming soon.</p></div>
        <span>© <span id="year">2026</span></span>
      </footer>
    </main>

    <dialog class="lightbox" aria-label="Portfolio image viewer">
      <button class="lightbox-close" aria-label="Close image">Close <span aria-hidden="true">×</span></button>
      <img alt="" />
      <p></p>
    </dialog>
  </body>
</html>
