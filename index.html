<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="Antonina, 21. New model based in Montreal." />
    <title>Antonina | Model Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;450;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <header class="rail">
      <div class="identity">
        <a class="name" href="#portfolio"><h1>Antonina</h1></a>
        <p>Montreal, Canada<br />21 · New model</p>
      </div>
      <nav aria-label="Main navigation">
        <a class="current" href="#portfolio"><span class="nav-dot" aria-hidden="true"></span>Portfolio <span class="count">04</span></a>
        <a href="#contact">Contact <span aria-hidden="true">↗</span></a>
      </nav>
      <div class="rail-note"><span>Model book</span><span>2026</span></div>
    </header>

    <main id="portfolio">
      <div class="book-heading"><p>Selected images</p><span>01 — 04</span></div>
      <section class="book" aria-label="Portfolio photographs">
        <figure>
          <button class="photo" data-photo data-title="01 / 04" aria-label="Open photograph 1 of 4"><img src="./photos/10064.jpg" alt="Antonina beside a tree in soft autumn light" fetchpriority="high" /></button>
        </figure>
        <figure>
          <button class="photo" data-photo data-title="02 / 04" aria-label="Open photograph 2 of 4"><img src="./photos/10061.jpg" alt="Antonina in a brown coat beneath golden autumn leaves" /></button>
        </figure>
        <figure>
          <button class="photo" data-photo data-title="03 / 04" aria-label="Open photograph 3 of 4"><img src="./photos/10055.jpg" alt="Antonina seated beneath a tree wearing a brown coat and black jeans" loading="lazy" /></button>
        </figure>
        <figure>
          <button class="photo" data-photo data-title="04 / 04" aria-label="Open photograph 4 of 4"><img src="./photos/10058.jpg" alt="Antonina in a black open-back top, seated by the water" loading="lazy" /></button>
        </figure>
      </section>
      <footer id="contact">
        <div><h2>Contact</h2><address><a href="mailto:email.testing@example.com">email.testing@example.com</a><a href="tel:+15141234567">514 123 4567</a></address></div>
        <span>© <span id="year">2026</span></span>
      </footer>
    </main>

    <dialog class="lightbox" aria-label="Portfolio image viewer">
      <button class="lightbox-close" aria-label="Close image">Close <span aria-hidden="true">×</span></button>
      <img id="viewer-photo" alt="" />
      <div class="carousel-controls">
        <button class="previous" aria-label="Previous photograph" aria-controls="viewer-photo">←</button>
        <span class="slide-count" aria-live="polite" aria-atomic="true">01 / 04</span>
        <button class="next" aria-label="Next photograph" aria-controls="viewer-photo">→</button>
      </div>
    </dialog>
  </body>
</html>
